name: Deploy

# staging branch -> Neon "staging" branch + feeduro-staging / feeduro-og-staging / feeduro-api-staging
# main branch    -> Neon "main" branch    + feeduro-production / feeduro-og-production / feeduro-api-production
#
# GitHub Actions owns the full sequence so migrate ALWAYS lands before deploy.
# Cloudflare Workers Builds git integration must be turned OFF (see repo docs),
# otherwise pushes would deploy twice.
on:
  push:
    branches: [staging, main]

# Never let two runs of the same branch overlap.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      # Fail fast (before install/build) if this branch has no Neon DB URL secret.
      - name: Verify Neon secret is set
        run: |
          if [ -z "${{ github.ref == 'refs/heads/main' && secrets.PRODUCTION_DATABASE_URL || secrets.STAGING_DATABASE_URL }}" ]; then
            echo "::error::No Neon DB URL secret set for ${{ github.ref_name }} (expected STAGING_DATABASE_URL / PRODUCTION_DATABASE_URL)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1. Build first — a broken build fails the run before we touch the DB.
      - name: Build (${{ env.TARGET }})
        working-directory: apps/web
        run: pnpm run build:${{ env.TARGET }}

      # 2. Apply migrations to the matching Neon branch, BEFORE deploying new code.
      #    Point DATABASE_URL at the Neon DIRECT (non-pooled) URL for this branch —
      #    pooled/pgbouncer chokes on DDL + advisory locks.
      - name: Apply migrations (${{ env.TARGET }})
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.PRODUCTION_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
        run: pnpm run db:migrate:deploy

      # 3. Deploy all three workers in order: web → og-worker → api.
      #    Attribution shown in the Cloudflare dashboard (Deployments tab):
      #      --tag      short SHA, so a version is filterable/rollback-able by commit
      #      --message  a human sentence: "<env> · <what shipped> · <commit> · <who>"
      #    Commit hash, branch and author are also auto-attached by wrangler from the
      #    checked-out .git tree. The commit subject is read from local git (not from
      #    ${{ }} interpolation) so an attacker-controlled message can't inject shell.
      - name: Deploy web worker (${{ env.TARGET }})
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          SUBJECT="$(git log -1 --pretty=%s | cut -c1-72)"
          ICON=$([ "$TARGET" = production ] && echo "🚀" || echo "🧪")
          pnpm exec wrangler deploy --env "$TARGET" \
            --tag "$SHORT_SHA" \
            --message "$ICON $TARGET · $SUBJECT · $SHORT_SHA · @$GITHUB_ACTOR"

      # og-worker is a service binding used by the web worker for OG image generation.
      # Deploy it after web so the web worker never references a stale OG worker version.
      - name: Deploy og-worker (${{ env.TARGET }})
        working-directory: apps/og-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          SUBJECT="$(git log -1 --pretty=%s | cut -c1-72)"
          ICON=$([ "$TARGET" = production ] && echo "🚀" || echo "🧪")
          pnpm exec wrangler deploy --env "$TARGET" \
            --tag "$SHORT_SHA" \
            --message "$ICON $TARGET · $SUBJECT · $SHORT_SHA · @$GITHUB_ACTOR"

      # api worker shares @feeduro/data-access with the web worker — deploy together
      # so both always run the same version of the data access layer.
      - name: Deploy API worker (${{ env.TARGET }})
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          SUBJECT="$(git log -1 --pretty=%s | cut -c1-72)"
          ICON=$([ "$TARGET" = production ] && echo "🚀" || echo "🧪")
          pnpm exec wrangler deploy --env "$TARGET" \
            --tag "$SHORT_SHA" \
            --message "$ICON $TARGET · $SUBJECT · $SHORT_SHA · @$GITHUB_ACTOR"
