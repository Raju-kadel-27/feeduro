name: feeduro-dev

services:
  db:
    image: postgres:16-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-feeduro}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-feeduro}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Translates the Neon serverless driver's WebSocket protocol to plain
  # Postgres TCP, so local dev uses the exact same driver/code path as prod.
  # The app connects to ws://localhost:5433/v1 (see app/db/index.ts local
  # config); APPEND_PORT points the proxy at the `db` service inside the
  # compose network.
  neon-proxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    restart: always
    ports:
      - "5433:80"
    environment:
      APPEND_PORT: "db:5432"
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "true"
    depends_on:
      db:
        condition: service_healthy

  smtp:
    image: axllent/mailpit
    container_name: feeduro-smtp
    restart: always
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  db_data:
